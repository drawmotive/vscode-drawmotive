name: VS Code Editor contracts
on:
  push:
    branches: ["**"]
    tags-ignore: ["coordinated-artifact-*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm test
      - id: release
        run: npm run release:status -- --github-output
      - if: steps.release.outputs.publishable == 'true'
        run: npm run build
      - if: steps.release.outputs.publishable == 'true'
        run: npm run vsce:package
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.publishable == 'true'
        with:
          name: drawmotive-vsix-${{ matrix.os }}-node-${{ matrix.node }}
          path: "*.vsix"
          if-no-files-found: error
