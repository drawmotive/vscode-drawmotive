name: Publish Retained Pre-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub prerelease containing the tested VSIX and receipt
        required: true
      archive:
        description: Retained VSIX filename
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked publication tooling
        run: npm ci --ignore-scripts
      - name: Download retained evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARCHIVE: ${{ inputs.archive }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARCHIVE" --pattern receipt.json --dir "$RUNNER_TEMP/retained"
      - name: Publish exact tested bytes
        run: npm run release:retained -- "$RUNNER_TEMP/retained"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - uses: actions/upload-artifact@v4
        with:
          name: marketplace-publication
          path: ${{ runner.temp }}/retained/publication.json
