name: Verify GitHub Pre-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Historical GitHub prerelease tag for retained archive verification
        required: true
      archive:
        description: Retained VSIX filename
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download GitHub preview evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARCHIVE: ${{ inputs.archive }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARCHIVE" --pattern receipt.json --dir "$RUNNER_TEMP/retained"
      - name: Verify exact tested bytes
        run: npm run release:verify-retained -- "$RUNNER_TEMP/retained"
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARCHIVE: ${{ inputs.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: github-preview-verification
          path: ${{ runner.temp }}/retained/verification.json
