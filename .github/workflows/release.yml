name: Release Stable Version

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build extension
        run: npm run package

      - name: Get current version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Release version: $VERSION"

      - name: Package extension
        run: npm run vsce:package

      - name: Publish to VS Code Marketplace
        run: npm run vsce:publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🚀 Stable Release v${{ env.VERSION }}

            See [CHANGELOG.md](https://github.com/drawmotive/vscode-drawmotive/blob/main/CHANGELOG.md) for full details.

            ### Installation
            Install from VS Code Marketplace or download the `.vsix` file below.

            ```bash
            code --install-extension vscode-drawmotive-${{ env.VERSION }}.vsix
            ```
          files: |
            *.vsix
